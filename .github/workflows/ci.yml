name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npx ng build

      - name: Upload the build
        uses: actions/upload-artifact@v4
        with:
          name: crypton-web
          path: dist/crypton/browser
          if-no-files-found: error

  docker:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
      - name: Build the web image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: crypton-web:ci

# The Playwright suite in e2e/ needs the API, the web app and a mail catcher running
# together, so it runs from the backend repository's docker compose stack rather than here.
# See README.md → "End-to-end tests".
